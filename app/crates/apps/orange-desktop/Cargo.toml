[package]
name = "orange-desktop"
description = "OrangeEditor desktop application: the window that hosts the editor interface"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "../../../build/locales.rs"

[[bin]]
name = "orange-editor"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
serde_json.workspace = true
rfd.workspace = true
global-hotkey.workspace = true
sys-locale.workspace = true
orange-audio = { path = "../../services/orange-audio", version = "=0.1.0-preview.1" }
orange-editor-ui = { path = "../../apps/orange-editor-ui", version = "=0.1.0-preview.1" }
orange-files = { path = "../../services/orange-files", version = "=0.1.0-preview.1" }
orange-host = { path = "../../platform/orange-host", version = "=0.1.0-preview.1" }
orange-native = { path = "../../platform/orange-native", version = "=0.1.0-preview.1" }
orange-sandbox = { path = "../../platform/orange-sandbox", version = "=0.1.0-preview.1" }
orange-sdk = { path = "../../platform/orange-sdk", version = "=0.1.0-preview.1" }
orange-net = { path = "../../services/orange-net", version = "=0.1.0-preview.1" }
orange-vault = { path = "../../platform/orange-vault", version = "=0.1.0-preview.1" }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
async-channel.workspace = true
futures-lite.workspace = true

[lints]
workspace = true

[dev-dependencies]
orange-testkit = { path = "../../dev/orange-testkit", version = "=0.1.0-preview.1", features = ["ui"] }
futures-lite.workspace = true
png = "=0.18.1"

[features]
documentation = ["orange-editor-ui/documentation"]

[[example]]
name = "docs_node_cards"
required-features = ["documentation"]
