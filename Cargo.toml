# Host application workspace (docs/02-architecture.md). Installable plugins build independently.
[workspace]
resolver = "3"
members = ["app/crates/*/*"]
exclude = ["plugins"]

[workspace.package]
version = "0.1.0-preview.1"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
claxon = "=0.4.3"
cpal = "=0.18.2"
# Windows audio sessions and per-application capture (process loopback). The same
# version cpal uses, so no second copy is built.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "=0.62.2"
hound = "=3.5.1"
# Directory-relative file calls (openat, renameat, unlinkat) for confined file access on
# Unix (orange-sandbox only). Already in the tree through async-io.
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }
# Dynamic library loading for native plugins (orange-native only).
libloading = "=0.9.0"
# The documentation canvas uses the same egui release with WebGL.
eframe-web = { package = "eframe", version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = "=0.3.106"
# Operating-system credential stores (orange-vault only).
# The editor interface. Fonts are built in so the library draws without a system font;
# the window uses wgpu, with AccessKit for screen readers.
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui-lucide = "=0.2.0"
egui-phosphor = "=0.14.0"
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
egui_material_icons = { version = "=0.9.0", default-features = false, features = ["outline"] }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu", "wayland", "x11"] }
rfd = "=0.18.0"
# Key presses while the editor is in the background, for On key pressed set to Anywhere
# (orange-desktop only): Windows, macOS and X11. Wayland goes through the portal below.
global-hotkey = "=0.10.0"
# The desktop GlobalShortcuts portal on Wayland (orange-desktop, Linux only). It shares the
# zbus and async-io stack AccessKit already brings.
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-channel = "=2.5.0"
futures-lite = "=2.6.1"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
# Translated text (docs/13): Fluent catalogues with arguments and CLDR plurals.
fluent-bundle = "=0.16.0"
fluent-syntax = "=0.12.0"
unic-langid = "=0.9.6"
# The language the operating system is set to (desktop only).
sys-locale = "=0.3.2"
indexmap = { version = "=2.14.2", features = ["serde"] }
proptest = "=1.12.0"
regex = "=1.13.1"
jiff = { version = "=0.2.24", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "=0.11.1"
# AIFF, MP3, Ogg Vorbis, and M4A decoding (orange-audio only). MPL-2.0, admitted in deny.toml.
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "aiff", "alac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
symphonia-opus = "=0.1.1"
thiserror = "=2.0.21"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
uuid = { version = "=1.29.2", features = ["serde"] }
zeroize = "=1.9.1"
# Wasmtime 48 LTS (supported 24 months); host-only (ADR-03). Default features off.
webpki-roots = "=1.0.12"
wat = "=1.263.0"
wasmtime = { version = "=50.0.2", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Line numbers for backtraces and profiles, without full debug info: with it, each test
# binary and its .pdb took hundreds of megabytes and a build folder grew past 100 GB.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Optimise across crate boundaries. Unwinding stays: the runtime catches a node's panic
# rather than losing the process with it.
lto = "thin"
codegen-units = 1
