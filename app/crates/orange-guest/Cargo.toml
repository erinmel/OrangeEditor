[package]
name = "orange-guest"
description = "OrangeEditor host-side Wasm component execution for installed packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Integration tests build as one binary (tests/main.rs).
autotests = false

[dependencies]
orange-kernel = { path = "../orange-kernel", version = "=0.0.0" }
orange-model = { path = "../orange-model", version = "=0.0.0" }
orange-packages = { path = "../orange-packages", version = "=0.0.0" }
serde_json.workspace = true
thiserror.workspace = true
# Only the Wasmtime features the host uses: no WASI, async runtime, cache or debug (ADR-03).
wasmtime.workspace = true

[dev-dependencies]
orange-compiler = { path = "../orange-compiler", version = "=0.0.0" }
orange-bundled = { path = "../orange-bundled", version = "=0.0.0" }
# Guest effects are exercised through a real compiled run.
orange-runtime = { path = "../orange-runtime", version = "=0.0.0" }
# Tests author components in the component text format.
wasmtime = { workspace = true, features = ["wat"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
