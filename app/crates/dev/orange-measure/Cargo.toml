[package]
name = "orange-measure"
description = "OrangeEditor measurement harness: allocation and pump-time baselines for core workloads (development only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Unit regressions run under workspace tests; heavy profiles require an explicit run.
[features]
default = ["allocation-counting"]
# Disable for whole-run latency measurements so allocations use the platform allocator.
allocation-counting = []

[dependencies]
orange-bundled = { path = "../../core/orange-bundled", version = "=0.1.0-preview.1" }
orange-compiler = { path = "../../core/orange-compiler", version = "=0.1.0-preview.1" }
orange-model = { path = "../../core/orange-model", version = "=0.1.0-preview.1" }
orange-runtime = { path = "../../core/orange-runtime", version = "=0.1.0-preview.1" }
serde_json.workspace = true

# Not `workspace = true`: the counting global allocator needs one `unsafe impl GlobalAlloc`,
# and the workspace `forbid` cannot be relaxed locally. `deny` keeps every other unsafe use
# an error; the single allowance is scoped to that impl and each block needs a SAFETY comment.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
