[package]
name = "orange-bundled"
description = "OrangeEditor bundled native scalar kernels and their public registry metadata"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Integration tests build as one binary (tests/main.rs).
autotests = false

[dependencies]
orange-kernel = { path = "../../core/orange-kernel", version = "=0.1.0-preview.1" }
orange-model = { path = "../../core/orange-model", version = "=0.1.0-preview.1" }
regex.workspace = true
jiff.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Tests and examples compile and run graphs; the library only implements kernels.
orange-compiler = { path = "../../core/orange-compiler", version = "=0.1.0-preview.1" }
orange-packages = { path = "../../platform/orange-packages", version = "=0.1.0-preview.1" }
orange-runtime = { path = "../../core/orange-runtime", version = "=0.1.0-preview.1" }
proptest.workspace = true

[lints]
workspace = true

[[example]]
name = "headless_authoring"
test = true

[[test]]
name = "integration"
path = "tests/main.rs"
