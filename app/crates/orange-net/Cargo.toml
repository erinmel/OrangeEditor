[package]
name = "orange-net"
description = "OrangeEditor base network package: HTTP connections and request nodes as a native host service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
orange-host = { path = "../orange-host", version = "=0.0.0" }
serde_json.workspace = true
# Blocking HTTP/1.1 client. Default features are off: no TLS stack is admitted by the
# dependency policy yet, so only `http://` endpoints are reachable.
ureq.workspace = true

[dev-dependencies]
orange-model = { path = "../orange-model", version = "=0.0.0" }

[lints]
workspace = true
