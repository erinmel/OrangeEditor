name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified during bootstrap
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - run: node tools/check-docs.mjs

  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - run: node tools/check-repo-policy.mjs

  rust_quality:
    name: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The runner's preinstalled rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust_tests:
    name: rust-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # rustup reads the shared pin on Linux x64, Windows x64 and macOS arm64.
      - run: rustup show active-toolchain
      - run: rustc --version --verbose
      - run: cargo test --workspace --locked

  rust:
    name: rust
    if: ${{ always() }}
    needs: [rust_quality, rust_tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require quality and every platform test
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.rust_quality.result }}
          TESTS_RESULT: ${{ needs.rust_tests.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$TESTS_RESULT" != "success" ]]; then
            echo "Rust quality or platform tests failed, were cancelled, or were skipped." >&2
            exit 1
          fi
