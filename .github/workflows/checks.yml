name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified during bootstrap
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - run: node tools/check-docs.mjs

  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - run: node tools/check-repo-policy.mjs

  rust_quality:
    name: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The runner's preinstalled rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build rustdoc with warnings denied
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  rust_policy:
    name: rust-policy
    outputs:
      msrv: ${{ steps.msrv.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - run: node tools/check-cargo-metadata.mjs --self-test
      - run: node tools/check-cargo-metadata.mjs
      - id: msrv
        name: Derive workspace MSRV from Cargo metadata
        shell: bash
        run: node tools/check-cargo-metadata.mjs --msrv >> "$GITHUB_OUTPUT"

  rust_msrv:
    name: rust-msrv
    needs: rust_policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install declared MSRV
        env:
          MSRV: ${{ needs.rust_policy.outputs.msrv }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - name: Record declared MSRV compiler
        env:
          MSRV: ${{ needs.rust_policy.outputs.msrv }}
        run: rustc +"$MSRV" --version --verbose
      - name: Test on declared MSRV
        env:
          MSRV: ${{ needs.rust_policy.outputs.msrv }}
        run: cargo +"$MSRV" test --workspace --locked

  dependency_security:
    name: dependency-security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned cargo-deny
        shell: bash
        run: |
          rustup show active-toolchain
          cargo install --locked --root "$RUNNER_TEMP/cargo-deny" cargo-deny --version 0.20.2
          echo "$RUNNER_TEMP/cargo-deny/bin" >> "$GITHUB_PATH"
      - name: Record cargo-deny version
        run: cargo deny --version
      - name: Check advisories and sources with current databases
        run: cargo deny --locked check advisories sources

  rust_tests:
    name: rust-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # rustup reads the shared pin on Linux x64, Windows x64 and macOS arm64.
      - run: rustup show active-toolchain
      - run: rustc --version --verbose
      - run: cargo test --workspace --locked

  rust:
    name: rust
    if: ${{ always() }}
    needs: [rust_quality, rust_policy, rust_msrv, dependency_security, rust_tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require quality and every platform test
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.rust_quality.result }}
          POLICY_RESULT: ${{ needs.rust_policy.result }}
          MSRV_RESULT: ${{ needs.rust_msrv.result }}
          SECURITY_RESULT: ${{ needs.dependency_security.result }}
          TESTS_RESULT: ${{ needs.rust_tests.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$POLICY_RESULT" != "success" || "$MSRV_RESULT" != "success" || "$SECURITY_RESULT" != "success" || "$TESTS_RESULT" != "success" ]]; then
            echo "Rust quality, policy, MSRV, dependency security, or platform tests failed, were cancelled, or were skipped." >&2
            exit 1
          fi
