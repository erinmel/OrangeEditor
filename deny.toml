[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "all"
unsound = "all"
yanked = "deny"
# The editor reaches Linux screen readers through accesskit, whose D-Bus client uses
# zbus 5. Its helper crates were merged into zbus 6 and marked unmaintained with no
# upgrade to move to; there is no known defect. Remove when accesskit moves to zbus 6.
ignore = ["RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]

# Unpublished workspace members carry no license until a release package declares one.
[licenses]
# ISC (ring, rustls-webpki, untrusted) and CDLA-Permissive-2.0 (webpki-roots, the Mozilla
# root certificate data) were admitted on 2026-11-10 for HTTPS in orange-net.
# MPL-2.0 (symphonia, the MP3 and Ogg decoder of orange-audio) was admitted by the
# project owner on 2026-11-12: it is used unmodified as a dependency.
# OFL-1.1 and Ubuntu-font-1.0 (epaint_default_fonts: the fonts egui draws with, built
# into the editor so it needs no system font) were admitted on 2026-11-13 with the editor.
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "MPL-2.0", "OFL-1.1", "Ubuntu-font-1.0", "Unicode-3.0", "Zlib"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
