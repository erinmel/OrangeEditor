[package]
name = "orange-bundled"
description = "OrangeEditor bundled native scalar kernels and their public registry metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Integration tests build as one binary (tests/main.rs).
autotests = false

[dependencies]
orange-kernel = { path = "../orange-kernel", version = "=0.0.0" }
orange-model = { path = "../orange-model", version = "=0.0.0" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Tests and examples compile and run graphs; the library only implements kernels.
orange-compiler = { path = "../orange-compiler", version = "=0.0.0" }
orange-packages = { path = "../orange-packages", version = "=0.0.0" }
orange-runtime = { path = "../orange-runtime", version = "=0.0.0" }
proptest.workspace = true

[lints]
workspace = true

[[example]]
name = "headless_authoring"
test = true

[[test]]
name = "integration"
path = "tests/main.rs"
