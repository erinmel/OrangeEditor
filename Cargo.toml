# Host application workspace (docs/15-monorepo-layout.md). Installable plugins build independently.
[workspace]
resolver = "3"
members = ["app/crates/orange-model", "app/crates/orange-kernel", "app/crates/orange-bundled", "app/crates/orange-compiler", "app/crates/orange-runtime", "app/crates/orange-measure", "app/crates/orange-packages", "app/crates/orange-guest", "app/crates/orange-host", "app/crates/orange-cli", "app/crates/orange-net", "app/crates/orange-sdk", "app/crates/orange-audio", "app/crates/orange-native", "app/crates/orange-plugin-example"]
exclude = ["plugins"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
cpal = "=0.18.2"
hound = "=3.5.1"
# Dynamic library loading for native plugins (orange-native only).
libloading = "=0.9.0"
indexmap = { version = "=2.14.2", features = ["serde"] }
proptest = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
ring = "=0.17.14"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
uuid = { version = "=1.29.0", features = ["serde"] }
# Wasmtime 48 LTS (supported 24 months); host-only (ADR-03). Default features off.
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
