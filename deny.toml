[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "all"
unsound = "all"
yanked = "deny"

# Unpublished workspace members carry no license until a release package declares one.
[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "Zlib"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
