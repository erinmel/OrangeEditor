[package]
name = "orange-docs-web"
description = "Interactive component examples for the OrangeEditor documentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe-web.workspace = true
orange-ui-controls = { path = "../../platform/orange-ui-controls", version = "=0.0.0", default-features = false }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }

[lints]
workspace = true
