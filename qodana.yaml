# Qodana static analysis (https://www.jetbrains.com/help/qodana/qodana-yaml.html).
# Do not store secrets here: this file's contents appear in the report.
version: "1.0"

profile:
  name: qodana.starter

# The Rust image has no C toolchain. Without one every build script (libc, serde,
# proc-macro2, ...) fails, the Cargo project model loads degraded, and Qodana reports
# the code it can no longer resolve as "possible project misconfiguration". cpal needs
# the ALSA headers on Linux, as in .github/workflows/checks.yml.
bootstrap: >-
  apt-get update &&
  apt-get install --yes --no-install-recommends build-essential pkg-config libasound2-dev

# Agent worktrees, notes and build output are not part of the product.
exclude:
  - name: All
    paths:
      - .claude
      - .codex
      - .agents
      - .artifacts
      - target

image: jetbrains/qodana-rust:2026.2-eap
