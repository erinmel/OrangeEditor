[package]
name = "orange-vault"
description = "OrangeEditor credential storage: the operating system's store and an in-memory store behind the SDK's SecretStore"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
os-vault-tests = []

[dependencies]
orange-sdk = { path = "../../platform/orange-sdk", version = "=0.1.1-preview" }
# Windows Credential Manager, macOS Keychain and the Linux Secret Service. The D-Bus
# client library is built from source (`vendored`), so no system package is needed.
keyring.workspace = true
zeroize.workspace = true

[lints]
workspace = true
