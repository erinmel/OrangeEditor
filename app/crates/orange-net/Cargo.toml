[package]
name = "orange-net"
description = "OrangeEditor base network package: HTTP connections and request nodes as a native host service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
orange-sdk = { path = "../orange-sdk", version = "=0.0.0" }
serde_json.workspace = true
# Blocking HTTP/1.1 client with rustls (ring provider, bundled Mozilla roots). The other
# default feature, gzip, stays off.
# Blocking WebSocket client sharing the same rustls stack.
# Ed25519 verification of signed update feeds; already the TLS stack's crypto provider.
ring.workspace = true
# TLS for MQTT connections: the stack the HTTP and WebSocket clients already use.
rustls.workspace = true
webpki-roots.workspace = true
tungstenite.workspace = true
ureq.workspace = true

[dev-dependencies]
orange-testkit = { path = "../orange-testkit", version = "=0.0.0" }
orange-host = { path = "../orange-host", version = "=0.0.0" }
orange-model = { path = "../orange-model", version = "=0.0.0" }
# Tests run a loopback WebSocket server.
tungstenite.workspace = true

[lints]
workspace = true
