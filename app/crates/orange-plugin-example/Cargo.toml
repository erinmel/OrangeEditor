[package]
name = "orange-plugin-example"
description = "Example OrangeEditor native plugin library: one node, built on the plugin SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
orange-sdk = { path = "../orange-sdk", version = "=0.0.0" }

# `export_plugin!` exports unmangled symbols, which the workspace's `forbid(unsafe_code)`
# does not permit; this crate denies unsafe code everywhere else.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
