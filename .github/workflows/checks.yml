name: PR validation

# Stage 1 (fast, Linux): repository rules, Rust quality, supply chain.
# Stage 2 (after repository rules pass): native tests and MSRV, parallel with quality.
# Stage 3: the single required `rust` status with a results table in the run summary.

on:
  push:
    branches: [dev, main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      extended:
        description: Also test Linux ARM64 and macOS Intel
        type: boolean
        default: true
  workflow_call:
    inputs:
      extended:
        description: Include additional native architectures and the full optimized suite
        type: boolean
        default: false
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: 1 · quality / clippy + docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's preinstalled rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: quality
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Clippy on every target
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rustdoc with warnings denied
        run: cargo doc --workspace --no-deps --all-features --locked
      - name: Check measurement tooling without allocator instrumentation
        run: cargo clippy -p orange-measure --no-default-features --locked -- -D warnings

  policy:
    name: 1 · rules / repository + workflows
    outputs:
      msrv: ${{ steps.msrv.outputs.version }}
      matrix: ${{ steps.platforms.outputs.matrix }}
      extended: ${{ steps.platforms.outputs.extended }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Rust formatting
        run: cargo fmt --all --check
      - id: platforms
        name: Select explicit native architecture coverage
        env:
          EXTENDED: ${{ github.event_name == 'schedule' || inputs.extended == true }}
        shell: bash
        run: |
          matrix=$(node tools/ci-platforms.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "extended=$EXTENDED" >> "$GITHUB_OUTPUT"
      - name: Core crates stay free of UI and engine frameworks
        run: |
          node tools/check-cargo-metadata.mjs --self-test
          node tools/check-cargo-metadata.mjs
      - id: msrv
        name: Derive workspace MSRV from Cargo metadata
        shell: bash
        run: node tools/check-cargo-metadata.mjs --msrv >> "$GITHUB_OUTPUT"
      - name: Validate CI/CD workflow syntax, expressions and shell steps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/actionlint"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -pyflakes= .github/workflows/*.yml
      - name: Audit workflow security
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/zizmor"
          gh release download v1.30.1 --repo zizmorcore/zizmor --pattern zizmor-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP/zizmor"
          echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  $RUNNER_TEMP/zizmor/zizmor-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/zizmor/zizmor-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/zizmor" --offline --format=github .github/workflows
      - name: Release contract
        run: |
          node --test tools/*.test.mjs
          node tools/release.mjs check

  supply_chain:
    name: 1 · dependencies / cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Restore pinned cargo-deny installation
        id: deny_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-deny
          key: cargo-deny-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.CARGO_DENY_VERSION }}
      - name: Install pinned cargo-deny on cache miss
        if: steps.deny_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install --locked --root "$RUNNER_TEMP/cargo-deny" cargo-deny --version "$CARGO_DENY_VERSION"
      - name: Add pinned cargo-deny to PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/cargo-deny/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/cargo-deny/bin/cargo-deny" --version)" = "cargo-deny $CARGO_DENY_VERSION"
      # Advisory data always refreshes; licenses, bans and sources follow deny.toml.
      - name: Check advisories, bans, licenses and sources
        run: cargo deny --locked check advisories bans licenses sources

  test:
    name: 2 · test / ${{ matrix.label }}
    needs: policy
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Keep file/line backtraces and debug assertions; avoid full local-variable symbols.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads the shared pin on Linux x64, Windows x64 and macOS arm64.
      - name: Verify native Rust host matches the declared architecture
        shell: bash
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          rustc --version --verbose
          test "$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')" = "$EXPECTED_HOST"
      - name: Cache native dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: native-${{ matrix.os }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Run workspace tests, including doctests
        shell: bash
        run: cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Summarize test results
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OS: ${{ matrix.label }}
        run: |
          grep -E '^test result:' "$RUNNER_TEMP/test.log" | awk -v os="$OS" '
            { passed += $4; failed += $6; ignored += $8 }
            END { printf "| %s | %d | %d | %d |\n", os, passed, failed, ignored }' > "$RUNNER_TEMP/row.md" || true
          {
            echo "### Debug workspace tests on $OS"
            echo "| OS | Passed | Failed | Ignored |"
            echo "|---|---|---|---|"
            cat "$RUNNER_TEMP/row.md"
            grep -E '^test .* FAILED$' "$RUNNER_TEMP/test.log" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

  optimized:
    name: 2 · behavior / release + examples
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustc --version --verbose
      - name: Cache optimized dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: optimized-linux-x64
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Optimized runtime and measurement regressions
        run: cargo test -p orange-runtime -p orange-measure --release --locked
      - name: Measurement regressions without the default feature
        run: cargo test -p orange-measure --no-default-features --release --locked
      - name: Embedding example behavior
        run: cargo test --workspace --examples --release --locked
      - name: Headless embedding smoke runs
        shell: bash
        run: |
          for example in headless_control headless_fork headless_authoring; do
            cargo run -p orange-bundled --example "$example" --release --locked
          done
      - name: Check all twelve optimized execution workloads
        shell: bash
        run: cargo run -p orange-measure --release --locked -- --execution --warmup 1 --runs 1 > "$RUNNER_TEMP/execution-smoke.json"
      - name: Full optimized workspace qualification on extended runs
        if: needs.policy.outputs.extended == 'true'
        run: cargo test --workspace --release --locked

  msrv:
    name: 2 · compatibility / MSRV ${{ needs.policy.outputs.msrv }}
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.policy.outputs.msrv }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared MSRV
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version --verbose
      - name: Cache MSRV dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Check every target on declared MSRV
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo check -p orange-measure --no-default-features --locked

  rust:
    name: rust
    if: ${{ always() }}
    needs: [quality, policy, supply_chain, test, optimized, msrv]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every stage and publish a results table
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Rust pipeline"
            echo "| Stage | Job | Result |"
            echo "|---|---|---|"
            jq -r '
              {quality: "1 quality", policy: "1 rules", supply_chain: "1 dependencies", test: "2 native behavior", optimized: "2 optimized behavior", msrv: "2 compatibility"} as $stage
              | to_entries[]
              | "| \($stage[.key]) | \(.key) | \(if .value.result == "success" then "✅" else "❌" end) \(.value.result) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<< "$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "::error title=Rust pipeline::Did not succeed: $failed"
            exit 1
          fi
