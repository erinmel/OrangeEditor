[package]
name = "orange-desktop"
description = "OrangeEditor desktop application: the window that hosts the editor interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "../../../build/locales.rs"

[[bin]]
name = "orange-editor"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
serde_json.workspace = true
rfd.workspace = true
sys-locale.workspace = true
orange-audio = { path = "../../services/orange-audio", version = "=0.0.0" }
orange-editor-ui = { path = "../../apps/orange-editor-ui", version = "=0.0.0" }
orange-files = { path = "../../services/orange-files", version = "=0.0.0" }
orange-host = { path = "../../platform/orange-host", version = "=0.0.0" }
orange-sdk = { path = "../../platform/orange-sdk", version = "=0.0.0" }
orange-net = { path = "../../services/orange-net", version = "=0.0.0" }
orange-vault = { path = "../../platform/orange-vault", version = "=0.0.0" }

[lints]
workspace = true
