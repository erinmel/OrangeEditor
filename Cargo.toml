# Host application workspace (docs/15-monorepo-layout.md). Installable plugins build independently.
[workspace]
resolver = "3"
members = ["app/crates/orange-model", "app/crates/orange-bundled", "app/crates/orange-compiler", "app/crates/orange-runtime", "app/crates/orange-measure", "app/crates/orange-packages", "app/crates/orange-guest"]
exclude = ["plugins"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
indexmap = { version = "=2.14.2", features = ["serde"] }
proptest = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
thiserror = "=2.0.21"
uuid = { version = "=1.29.0", features = ["serde"] }
# Wasmtime 48 LTS (supported 24 months); host-only (ADR-03). Default features off.
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
