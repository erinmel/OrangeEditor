name: PR validation

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full-platform-tests:
        description: Execute tests on every native OS during release qualification.
        type: boolean
        default: false
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust_checks:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: rust-format
            command: cargo fmt --all --check
          - check: rust-clippy
            command: cargo clippy --workspace --all-targets --locked -- -D warnings
          - check: rustdoc
            command: cargo doc --workspace --no-deps --locked
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's preinstalled rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - name: Cache compiled dependencies
        if: matrix.check != 'rust-format'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.check }}
          cache-bin: false
      - name: ${{ matrix.check }}
        run: ${{ matrix.command }}

  rust_architecture:
    name: rust-architecture
    outputs:
      msrv: ${{ steps.msrv.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: node tools/check-cargo-metadata.mjs --self-test
      - run: node tools/check-cargo-metadata.mjs
      - id: msrv
        name: Derive workspace MSRV from Cargo metadata
        shell: bash
        run: node tools/check-cargo-metadata.mjs --msrv >> "$GITHUB_OUTPUT"

  rust_msrv:
    name: msrv-compatibility
    needs: rust_architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.rust_architecture.outputs.msrv }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared MSRV
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Record declared MSRV compiler
        run: rustc --version --verbose
      - name: Cache MSRV dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
          cache-bin: false
      - name: Check every target on declared MSRV
        run: cargo check --workspace --all-targets --locked

  dependency_security:
    name: dependency-security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Restore pinned cargo-deny installation
        id: deny_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-deny
          key: cargo-deny-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.CARGO_DENY_VERSION }}
      - name: Install pinned cargo-deny on cache miss
        if: steps.deny_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --locked --root "$RUNNER_TEMP/cargo-deny" cargo-deny --version "$CARGO_DENY_VERSION"
      - name: Add pinned cargo-deny to PATH
        shell: bash
        run: echo "$RUNNER_TEMP/cargo-deny/bin" >> "$GITHUB_PATH"
      - name: Verify cargo-deny version
        shell: bash
        run: |
          cargo deny --version
          test "$(cargo deny --version)" = "cargo-deny $CARGO_DENY_VERSION"
      - name: Check advisories and sources with current databases
        run: cargo deny --locked check advisories sources

  release_contract:
    name: workflow-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Validate CI/CD workflow syntax and expressions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/actionlint"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - run: node --test tools/release.test.mjs
      - run: node tools/release.mjs check

  rust_tests:
    name: native-compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads the shared pin on Linux x64, Windows x64 and macOS arm64.
      - run: rustup show active-toolchain
      - run: rustc --version --verbose
      - name: Cache native dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: native-${{ matrix.os }}
          cache-bin: false
      - name: Run workspace tests
        if: matrix.os == 'ubuntu-24.04' || inputs.full-platform-tests || github.event_name == 'schedule'
        run: cargo test --workspace --locked
      - name: Compile and link test targets without duplicate execution
        if: matrix.os != 'ubuntu-24.04' && !inputs.full-platform-tests && github.event_name != 'schedule'
        run: cargo test --workspace --all-targets --locked --no-run

  rust:
    name: rust
    if: ${{ always() }}
    needs: [rust_checks, rust_architecture, rust_msrv, dependency_security, release_contract, rust_tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all Rust checks
        shell: bash
        env:
          CHECKS_RESULT: ${{ needs.rust_checks.result }}
          ARCHITECTURE_RESULT: ${{ needs.rust_architecture.result }}
          MSRV_RESULT: ${{ needs.rust_msrv.result }}
          SECURITY_RESULT: ${{ needs.dependency_security.result }}
          RELEASE_CONTRACT_RESULT: ${{ needs.release_contract.result }}
          TESTS_RESULT: ${{ needs.rust_tests.result }}
        run: |
          if [[ "$CHECKS_RESULT" != "success" || "$ARCHITECTURE_RESULT" != "success" || "$MSRV_RESULT" != "success" || "$SECURITY_RESULT" != "success" || "$RELEASE_CONTRACT_RESULT" != "success" || "$TESTS_RESULT" != "success" ]]; then
            echo "A required code, dependency, release-contract, or native compatibility check did not succeed." >&2
            exit 1
          fi
